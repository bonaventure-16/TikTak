<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101522">
    <title>Your Move — Tic-Tac-Toe</title>
    <link rel="stylesheet" href="style.css">
    <script src="game.js" defer></script>
</head>

<body class="game-page">
    <main class="game-shell">
        <header class="game-header">
            <a class="wordmark" href="index.html" aria-label="Three in a Row home">THREE<span>/</span>ROW</a>
            <a class="button button-quiet quit-link" href="index.html">Quit game <span aria-hidden="true">↗</span></a>
        </header>

        <section class="game-content" aria-labelledby="game-title">
            <p class="eyebrow">You are X · Computer is O</p>
            <h1 id="game-title">Your move.</h1>
            <p id="game-status" class="game-status" role="status" aria-live="polite">Pick a square to begin.</p>

            <section class="scoreboard" aria-label="Scoreboard">
                <div class="score-card player-score">
                    <span class="score-symbol">X</span>
                    <span class="score-name">You</span>
                    <strong id="player-score">0</strong>
                </div>
                <div class="score-card draw-score">
                    <span class="score-symbol">=</span>
                    <span class="score-name">Draws</span>
                    <strong id="draw-score">0</strong>
                </div>
                <div class="score-card computer-score">
                    <span class="score-symbol">O</span>
                    <span class="score-name">Computer</span>
                    <strong id="computer-score">0</strong>
                </div>
            </section>

            <div id="board" class="board" role="group" aria-label="Tic-Tac-Toe board">
                <button class="cell" type="button" data-cell="0" aria-label="Row 1, column 1: empty"></button>
                <button class="cell" type="button" data-cell="1" aria-label="Row 1, column 2: empty"></button>
                <button class="cell" type="button" data-cell="2" aria-label="Row 1, column 3: empty"></button>
                <button class="cell" type="button" data-cell="3" aria-label="Row 2, column 1: empty"></button>
                <button class="cell" type="button" data-cell="4" aria-label="Row 2, column 2: empty"></button>
                <button class="cell" type="button" data-cell="5" aria-label="Row 2, column 3: empty"></button>
                <button class="cell" type="button" data-cell="6" aria-label="Row 3, column 1: empty"></button>
                <button class="cell" type="button" data-cell="7" aria-label="Row 3, column 2: empty"></button>
                <button class="cell" type="button" data-cell="8" aria-label="Row 3, column 3: empty"></button>
            </div>

            <div class="game-actions">
                <button id="new-round" class="button button-primary" type="button">New round</button>
                <button id="reset-scores" class="button button-quiet" type="button">Reset scores</button>
            </div>
            <p id="storage-message" class="storage-message" role="status" aria-live="polite"></p>
        </section>
        <footer class="game-footer">Scores are saved on this device.</footer>
    </main>
</body>

</html>
